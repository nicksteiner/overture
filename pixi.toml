# One environment with the three pieces, in order:
#   1. OPERA DSWx (dswx_sar)   the algorithm
#   2. this package             windows, state, frame threshold field, reduce
#   3. openSEPPO                search and chunked reads from the ASF archive
#
#   pixi install
#   pixi run test
#   pixi run overture run --h5 wet=<gcov.h5> --h5 ref=<gcov.h5> --out <run_dir>
[workspace]
name = "overture"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
# what OPERA dswx_sar imports
gdal = ">=3.8"
rasterio = "*"
h5py = "*"
numpy = "*"
scipy = "*"
scikit-image = "*"
py-opencv = "*"
joblib = "*"
pyproj = "*"
shapely = "*"
geopandas = "*"
mgrs = "*"
yamale = "*"
"ruamel.yaml" = "*"
pyyaml = "*"
psutil = "*"
matplotlib-base = "*"
boto3 = "*"
curl = "*"
pip = "*"
pytest = "*"
# 3. data access
openseppo = ">=0.7.1"
netcdf4 = "*"

[pypi-dependencies]
# 1. the algorithm: OPERA dswx_sar (pip name dswx-s1). Pinned to a commit of the fork that
#    carries the float16, partial-water and GDAL 3.12 fixes; switch to
#    https://github.com/opera-adt/DSWX-SAR.git once they are merged upstream.
dswx-s1 = { git = "https://github.com/nicksteiner/DSWX-SAR.git", rev = "f2e1cc31d95a278f9842efeb2d04a507b57cd57d" }
# 2. this package
overture = { path = ".", editable = true }

[activation.env]
# keep packages in ~/.local out of the environment
PYTHONNOUSERSITE = "1"

[tasks]
test = "pytest -q"
